<main><h1>#1056 界面预览</h1><p class="m">commit dc6ad6c · <a href="https://github.com/yetone/magpie/pull/1056">回到 PR</a> · Routing 页「路由组」一节的表头不再每敲一个键就整行重建：只有在表头组成真的变化（如点击「选择」、删掉组、只剩一个组）时才重建，因此正在输入的筛选框在打字过程中始终是同一个节点、焦点与光标不再被手工搬回。</p>
